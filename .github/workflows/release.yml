name: Release on Tag

on:
    push:
        tags:
            - "*"

jobs:
    create_release:
        name: Create Release and attach CI artifacts
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Prepare
              run: |
                  echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
                  echo "GITHUB_REF=${GITHUB_REF}"
                  echo "GITHUB_SHA=${GITHUB_SHA}"
                  TAG_NAME="${GITHUB_REF#refs/tags/}"
                  echo "TAG_NAME=${TAG_NAME}"
                  echo "::set-output name=tag::${TAG_NAME}"
              id: prep

            - name: Find CI workflow run for this tag commit
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  owner_repo="${GITHUB_REPOSITORY}"
                  sha="${GITHUB_SHA}"
                  echo "Searching workflow runs for commit $sha"
                  runs_json=$(curl -sS -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${owner_repo}/actions/runs?per_page=100&head_sha=${sha}")
                  echo "$runs_json" | jq '.workflow_runs[] | {id: .id, name: .name, status: .status, conclusion: .conclusion}' > runs_list.json || true
                  run_id=$(echo "$runs_json" | jq -r '.workflow_runs[] | select(.name=="CI - Linux builds" and .conclusion=="success") | .id' | head -n1)
                  if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
                    echo "No successful CI run named 'CI - Linux builds' found for commit $sha"
                    echo "Available runs:" && cat runs_list.json || true
                    exit 1
                  fi
                  echo "Found CI run id: $run_id"
                  echo "::set-output name=ci_run_id::$run_id"
              id: find_run

            - name: List artifacts for CI run
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  owner_repo="${GITHUB_REPOSITORY}"
                  run_id=${{ steps.find_run.outputs.ci_run_id }}
                  echo "Listing artifacts for run $run_id"
                  artifacts_json=$(curl -sS -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${owner_repo}/actions/runs/${run_id}/artifacts")
                  echo "$artifacts_json" | jq '.artifacts[] | {id: .id, name: .name, size_in_bytes: .size_in_bytes, archive_download_url: .archive_download_url}' > artifacts_list.json || true
                  cat artifacts_list.json
                  echo "::set-output name=artifacts_json::$(cat artifacts_list.json | jq -c '.[]' | sed ':a;N;$!ba;s/\n/|/g')"
              id: list_artifacts

            - name: Download artifacts
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  mkdir -p artifacts
                  owner_repo="${GITHUB_REPOSITORY}"
                  run_id=${{ steps.find_run.outputs.ci_run_id }}
                  # Fetch artifacts list again to be robust
                  artifacts_json=$(curl -sS -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${owner_repo}/actions/runs/${run_id}/artifacts")
                  count=$(echo "$artifacts_json" | jq '.artifacts | length')
                  echo "Found $count artifacts"
                  for i in $(seq 0 $(($count - 1))); do
                    name=$(echo "$artifacts_json" | jq -r ".artifacts[$i].name")
                    url=$(echo "$artifacts_json" | jq -r ".artifacts[$i].archive_download_url")
                    echo "Downloading artifact: $name from $url"
                    # download via API (follow redirects)
                    curl -sS -L -H "Authorization: token ${GITHUB_TOKEN}" -o "artifacts/${name}.zip" "$url"
                  done

            - name: Create GitHub Release
              id: create_release
              uses: actions/create-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ github.ref_name }}
                  release_name: ${{ github.ref_name }}
                  body: "Automated release for tag ${{ github.ref_name }}"
                  draft: false
                  prerelease: false

            - name: Upload release assets
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  upload_url=${{ steps.create_release.outputs.upload_url }}
                  echo "Release upload_url=$upload_url"
                  for f in artifacts/*; do
                    if [ -f "$f" ]; then
                      name=$(basename "$f")
                      echo "Uploading $name"
                      curl -sS -X POST -H "Authorization: token ${GITHUB_TOKEN}" -H "Content-Type: application/zip" --data-binary @"$f" "${upload_url}?name=${name}"
                    fi
                  done
