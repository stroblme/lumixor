name: CI - Linux builds

on:
  # push:
  # pull_request:
  workflow_dispatch:

jobs:
  build-ubuntu:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo ./install-build-dependencies.sh

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -- -j$(nproc)

      - name: Package
        run: |
          mkdir -p artifacts
          if [ -f build/lumixor-qt ]; then cp build/lumixor-qt artifacts/; fi
          tar -C build -czf artifacts/lumixor-ubuntu.tgz lumixor-qt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumixor-ubuntu
          path: artifacts/

  build-debian:
    name: Build (Debian bookworm)
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

