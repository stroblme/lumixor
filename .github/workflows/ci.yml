name: CI

on:
    push:
        tags:
            - "*"
    workflow_dispatch:

jobs:
    appimage:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    cmake \
                    qtbase5-dev \
                    qtmultimedia5-dev \
                    qtdeclarative5-dev \
                    qtquickcontrols2-5-dev \
                    libexiv2-dev \
                    libqt5svg5-dev \
                    libunwind-dev \
                    qml-module-qtquick2 \
                    qml-module-qtquick-window2 \
                    qml-module-qtquick-controls2 \
                    qml-module-qtquick-layouts \
                    qml-module-qtmultimedia \
                    qml-module-qt-labs-platform \
                    libgstreamer1.0-dev \
                    libgstreamer-plugins-base1.0-dev \
                    gstreamer1.0-plugins-base \
                    gstreamer1.0-plugins-good \
                    gstreamer1.0-plugins-bad \
                    gstreamer1.0-plugins-ugly \
                    gstreamer1.0-libav \
                    gstreamer1.0-alsa \
                    gstreamer1.0-pulseaudio \
                    fuse \
                    libfuse2
            - name: Build
              run: |
                  mkdir build
                  cd build
                  cmake ..
                  make -j$(nproc)
            - name: Download linuxdeployqt
              run: |
                  wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
                  chmod a+x linuxdeployqt-continuous-x86_64.AppImage
            - name: Create AppImage
              run: |
                  cd build

                  # Copy desktop file and icon
                  cp ../resources/lumixor.desktop lumixor-qt.desktop
                  cp ../resources/lumixor.svg lumixor-qt.svg

                  # Get Qt paths
                  QT_PLUGIN_PATH=$(qmake -query QT_INSTALL_PLUGINS)
                  QT_QML_PATH=$(qmake -query QT_INSTALL_QML)
                  QT_LIB_PATH=$(qmake -query QT_INSTALL_LIBS)

                  # Create AppDir structure
                  mkdir -p AppDir/usr/bin
                  mkdir -p AppDir/usr/lib
                  mkdir -p AppDir/usr/lib/gstreamer-1.0
                  mkdir -p AppDir/usr/plugins
                  mkdir -p AppDir/usr/qml
                  mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
                  mkdir -p AppDir/usr/share/applications

                  # Copy binary
                  cp lumixor-qt AppDir/usr/bin/

                  # Verify binary is valid ELF
                  file AppDir/usr/bin/lumixor-qt

                  # Copy desktop file and icon
                  cp lumixor-qt.desktop AppDir/usr/share/applications/
                  cp lumixor-qt.svg AppDir/usr/share/icons/hicolor/256x256/apps/
                  cp lumixor-qt.svg AppDir/lumixor-qt.svg
                  cp lumixor-qt.desktop AppDir/lumixor-qt.desktop

                  # Copy required QML modules
                  QML_DIRS="QtQuick QtQuick.2 QtMultimedia Qt QtGraphicalEffects"
                  for dir in $QML_DIRS; do
                    if [ -d "$QT_QML_PATH/$dir" ]; then
                      cp -r "$QT_QML_PATH/$dir" AppDir/usr/qml/
                    fi
                  done

                  # Also copy from common alternative locations
                  for dir in $QML_DIRS; do
                    if [ -d "/usr/lib/x86_64-linux-gnu/qt5/qml/$dir" ]; then
                      cp -r "/usr/lib/x86_64-linux-gnu/qt5/qml/$dir" AppDir/usr/qml/ 2>/dev/null || true
                    fi
                  done

                  # List what we have for debugging
                  echo "QML modules copied:"
                  ls -la AppDir/usr/qml/

                  # Copy all Qt5 libraries to ensure consistency
                  cp -L $QT_LIB_PATH/libQt5*.so.5 AppDir/usr/lib/ 2>/dev/null || true

                  # Copy Qt multimedia plugins
                  mkdir -p AppDir/usr/plugins/mediaservice
                  cp -r $QT_PLUGIN_PATH/mediaservice/* AppDir/usr/plugins/mediaservice/ 2>/dev/null || true
                  cp -r /usr/lib/x86_64-linux-gnu/qt5/plugins/mediaservice/* AppDir/usr/plugins/mediaservice/ 2>/dev/null || true

                  # Copy GStreamer plugins and libraries
                  echo "Copying GStreamer libraries..."
                  cp -L /usr/lib/x86_64-linux-gnu/libgst*.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/gstreamer-1.0/*.so AppDir/usr/lib/gstreamer-1.0/ 2>/dev/null || true

                  # Copy GStreamer base libraries
                  cp -L /usr/lib/x86_64-linux-gnu/libgstvideo-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstaudio-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstbase-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstreamer-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstpbutils-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstapp-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstgl-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstrtp-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstrtsp-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstsdp-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgsttag-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstfft-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstcheck-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstcontroller-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstnet-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstcodecparsers-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstbadaudio-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstplayer-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstinsertbin-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstmpegts-1.0.so* AppDir/usr/lib/ 2>/dev/null || true
                  cp -L /usr/lib/x86_64-linux-gnu/libgstallocators-1.0.so* AppDir/usr/lib/ 2>/dev/null || true

                  # List GStreamer plugins for debugging
                  echo "GStreamer plugins copied:"
                  ls -la AppDir/usr/lib/gstreamer-1.0/ | head -20

                  # Copy custom AppRun script that properly sets library paths
                  cp ../resources/AppRun AppDir/AppRun
                  chmod +x AppDir/AppRun

                  # Run linuxdeployqt once with all options
                  ../linuxdeployqt-continuous-x86_64.AppImage AppDir/usr/share/applications/lumixor-qt.desktop -qmldir=../src/ui/qml -qmldir=AppDir/usr/qml -bundle-non-qt-libs -no-translations -no-copy-copyright-files -extra-plugins=iconengines,imageformats,mediaservice -appimage
            - name: Upload AppImage
              uses: actions/upload-artifact@v4
              with:
                  name: Lumixor-AppImage
                  path: build/*.AppImage

    release:
        runs-on: ubuntu-latest
        needs: appimage
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Download AppImage artifact
              uses: actions/download-artifact@v4
              with:
                  name: Lumixor-AppImage
                  path: artifacts
            - name: Generate changelog
              id: changelog
              run: |
                  # Get the previous tag
                  PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
                  CURRENT_TAG=${GITHUB_REF#refs/tags/}

                  echo "## What's Changed in $CURRENT_TAG" > CHANGELOG.md
                  echo "" >> CHANGELOG.md

                  if [ -n "$PREVIOUS_TAG" ]; then
                    echo "### Commits since $PREVIOUS_TAG:" >> CHANGELOG.md
                    git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD >> CHANGELOG.md
                  else
                    echo "### All commits:" >> CHANGELOG.md
                    git log --pretty=format:"- %s (%h)" >> CHANGELOG.md
                  fi

                  echo "" >> CHANGELOG.md
                  echo "" >> CHANGELOG.md
                  echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG:-$(git rev-list --max-parents=0 HEAD)}...$CURRENT_TAG" >> CHANGELOG.md
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: artifacts/*.AppImage
                  body_path: CHANGELOG.md
                  draft: false
                  prerelease: false
