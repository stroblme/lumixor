name: CI - Linux builds

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-ubuntu:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo ./scripts/install-build-dependencies.sh

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -- -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p artifacts
          if [ -f build/lumixor-qt ]; then cp build/lumixor-qt artifacts/; fi
          tar -C build -czf artifacts/lumixor-ubuntu.tgz lumixor-qt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: lumixor-ubuntu
          path: artifacts/

  release:
    name: Release on tag
    needs: build-ubuntu
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: lumixor-ubuntu
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
